<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gerenciador de Processos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout Principal */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar - Agora visível em todas as telas */
        .sidebar {
            width: 280px;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        /* Menu Hamburguer - Apenas para mobile */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .menu-toggle svg {
            width: 24px;
            height: 24px;
            fill: #667eea;
        }

        /* Overlay para mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        /* Barra de Pesquisa - Corrigida */
        .search-container {
            margin-top: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.3);
        }

        /* Cards de Processos */
        .processos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .processo-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .processo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .processo-card.selecionado {
            border: 2px solid #667eea;
            background: #f8f9ff;
        }

        .processo-titulo {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .processo-info {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        /* Formulário */
        .form-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Botões */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            background: #c53030;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        /* Status */
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-andamento {
            background: #fef3c7;
            color: #d97706;
        }

        .status-concluido {
            background: #d4edda;
            color: #155724;
        }

        .status-pendente {
            background: #f8d7da;
            color: #721c24;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .main-content {
                padding: 60px 15px 15px 15px;
            }

            .processos-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 769px) {
            .sidebar {
                transform: translateX(0) !important;
                position: relative;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Menu Hamburguer (Mobile) -->
        <button class="menu-toggle" id="menuToggle">
            <svg viewBox="0 0 24 24">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
        </button>

        <!-- Overlay para mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar com Lista de Processos -->
        <div class="sidebar" id="sidebar">
            <div style="padding: 20px; border-bottom: 1px solid #e0e0e0;">
                <h2 style="color: #667eea;">Processos</h2>
                <p style="font-size: 12px; color: #666; margin-top: 5px;" id="processosCount">0 processos</p>
            </div>
            <div id="processosList" style="flex: 1; overflow-y: auto; padding: 10px;">
                <!-- Lista de processos será inserida aqui -->
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="main-content">
            <!-- Header com Barra de Pesquisa -->
            <div class="header">
                <h1>Gerenciador de Processos</h1>
                <div class="search-container">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput" 
                        placeholder="Pesquisar processos por número, título ou cliente..."
                        autocomplete="off"
                    >
                </div>
            </div>

            <!-- Formulário de Cadastro/Edição -->
            <div class="form-container">
                <h3 id="formTitle">Novo Processo</h3>
                <form id="processoForm">
                    <input type="hidden" id="processoId">
                    <div class="form-group">
                        <label>Número do Processo *</label>
                        <input type="text" id="numero" required placeholder="Ex: 1234567-89.2024.8.26.0100">
                    </div>
                    <div class="form-group">
                        <label>Título *</label>
                        <input type="text" id="titulo" required placeholder="Título do processo">
                    </div>
                    <div class="form-group">
                        <label>Cliente *</label>
                        <input type="text" id="cliente" required placeholder="Nome do cliente">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="andamento">Em Andamento</option>
                            <option value="pendente">Pendente</option>
                            <option value="concluido">Concluído</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="descricao" rows="3" placeholder="Descrição detalhada do processo"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Data de Cadastro</label>
                        <input type="date" id="dataCadastro">
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary" id="saveBtn">Salvar Processo</button>
                        <button type="button" class="btn btn-danger" id="cancelBtn" style="display: none;">Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Lista de Processos (Grid) -->
            <div id="processosGrid" class="processos-grid">
                <!-- Processos serão listados aqui -->
            </div>
        </div>
    </div>

    <script>
        // Banco de dados IndexedDB
        const DB_NAME = 'ProcessosDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'processos';

        let db = null;
        let currentProcessoId = null;
        let processos = [];
        let searchTimeout = null;

        // Inicializar banco de dados
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('numero', 'numero', { unique: false });
                        store.createIndex('titulo', 'titulo', { unique: false });
                        store.createIndex('cliente', 'cliente', { unique: false });
                        store.createIndex('status', 'status', { unique: false });
                        store.createIndex('dataCadastro', 'dataCadastro', { unique: false });
                    }
                };
            });
        }

        // Carregar todos os processos
        async function carregarProcessos() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onsuccess = () => {
                    processos = request.result || [];
                    // Ordenar por data decrescente
                    processos.sort((a, b) => new Date(b.dataCadastro) - new Date(a.dataCadastro));
                    resolve(processos);
                };
                request.onerror = () => reject(request.error);
            });
        }

        // Salvar processo
        async function salvarProcesso(processo) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = processo.id ? store.put(processo) : store.add(processo);

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Deletar processo
        async function deletarProcesso(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // Renderizar sidebar com lista de processos
        function renderizarSidebar() {
            const processosList = document.getElementById('processosList');
            const processosCount = document.getElementById('processosCount');
            
            processosCount.textContent = `${processos.length} ${processos.length === 1 ? 'processo' : 'processos'}`;
            
            if (processos.length === 0) {
                processosList.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">Nenhum processo cadastrado</div>';
                return;
            }

            processosList.innerHTML = processos.map(processo => `
                <div 
                    class="processo-item" 
                    onclick="selecionarProcesso(${processo.id})"
                    style="
                        padding: 12px;
                        margin-bottom: 8px;
                        background: ${currentProcessoId === processo.id ? '#f0f4ff' : 'white'};
                        border-radius: 8px;
                        cursor: pointer;
                        transition: all 0.3s;
                        border-left: 3px solid ${getStatusColor(processo.status)};
                    "
                    onmouseover="this.style.transform='translateX(5px)'"
                    onmouseout="this.style.transform='translateX(0)'"
                >
                    <div style="font-weight: bold; font-size: 14px; color: #333;">${processo.numero}</div>
                    <div style="font-size: 12px; color: #666; margin-top: 5px;">${processo.titulo}</div>
                    <div style="font-size: 11px; color: #999; margin-top: 5px;">${processo.cliente}</div>
                </div>
            `).join('');
        }

        // Renderizar grid de processos
        function renderizarGrid(filtro = '') {
            const grid = document.getElementById('processosGrid');
            let processosFiltrados = processos;

            if (filtro) {
                const searchLower = filtro.toLowerCase();
                processosFiltrados = processos.filter(p => 
                    p.numero.toLowerCase().includes(searchLower) ||
                    p.titulo.toLowerCase().includes(searchLower) ||
                    p.cliente.toLowerCase().includes(searchLower)
                );
            }

            if (processosFiltrados.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #999;">Nenhum processo encontrado</div>';
                return;
            }

            grid.innerHTML = processosFiltrados.map(processo => `
                <div class="processo-card ${currentProcessoId === processo.id ? 'selecionado' : ''}" onclick="selecionarProcesso(${processo.id})">
                    <div class="processo-titulo">${processo.titulo}</div>
                    <div class="processo-info">
                        <strong>Número:</strong> ${processo.numero}<br>
                        <strong>Cliente:</strong> ${processo.cliente}<br>
                        <strong>Status:</strong> 
                        <span class="status-badge status-${processo.status}">
                            ${getStatusTexto(processo.status)}
                        </span><br>
                        <strong>Data:</strong> ${formatarData(processo.dataCadastro)}<br>
                        ${processo.descricao ? `<strong>Descrição:</strong> ${processo.descricao.substring(0, 100)}${processo.descricao.length > 100 ? '...' : ''}` : ''}
                    </div>
                    <div style="margin-top: 15px;">
                        <button class="btn btn-primary" onclick="event.stopPropagation(); editarProcesso(${processo.id})" style="padding: 5px 10px; font-size: 12px;">Editar</button>
                        <button class="btn btn-danger" onclick="event.stopPropagation(); confirmarExclusao(${processo.id})" style="padding: 5px 10px; font-size: 12px;">Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        // Selecionar processo
        function selecionarProcesso(id) {
            currentProcessoId = id;
            const processo = processos.find(p => p.id === id);
            if (processo) {
                preencherFormulario(processo);
            }
            renderizarSidebar();
            renderizarGrid(document.getElementById('searchInput').value);
            
            // Fechar sidebar no mobile após seleção
            if (window.innerWidth < 768) {
                fecharSidebar();
            }
        }

        // Preencher formulário para edição
        function editarProcesso(id) {
            const processo = processos.find(p => p.id === id);
            if (processo) {
                preencherFormulario(processo);
                document.getElementById('formTitle').textContent = 'Editar Processo';
                document.getElementById('cancelBtn').style.display = 'inline-block';
            }
        }

        // Preencher formulário
        function preencherFormulario(processo) {
            document.getElementById('processoId').value = processo.id || '';
            document.getElementById('numero').value = processo.numero || '';
            document.getElementById('titulo').value = processo.titulo || '';
            document.getElementById('cliente').value = processo.cliente || '';
            document.getElementById('status').value = processo.status || 'andamento';
            document.getElementById('descricao').value = processo.descricao || '';
            document.getElementById('dataCadastro').value = processo.dataCadastro || new Date().toISOString().split('T')[0];
        }

        // Limpar formulário
        function limparFormulario() {
            document.getElementById('processoId').value = '';
            document.getElementById('numero').value = '';
            document.getElementById('titulo').value = '';
            document.getElementById('cliente').value = '';
            document.getElementById('status').value = 'andamento';
            document.getElementById('descricao').value = '';
            document.getElementById('dataCadastro').value = new Date().toISOString().split('T')[0];
            document.getElementById('formTitle').textContent = 'Novo Processo';
            document.getElementById('cancelBtn').style.display = 'none';
            currentProcessoId = null;
        }

        // Confirmar exclusão
        async function confirmarExclusao(id) {
            if (confirm('Tem certeza que deseja excluir este processo?')) {
                await deletarProcesso(id);
                await carregarProcessos();
                
                if (currentProcessoId === id) {
                    limparFormulario();
                }
                
                renderizarSidebar();
                renderizarGrid(document.getElementById('searchInput').value);
                alert('Processo excluído com sucesso!');
            }
        }

        // Funções auxiliares
        function getStatusColor(status) {
            const colors = {
                'andamento': '#f39c12',
                'pendente': '#e74c3c',
                'concluido': '#27ae60'
            };
            return colors[status] || '#95a5a6';
        }

        function getStatusTexto(status) {
            const textos = {
                'andamento': 'Em Andamento',
                'pendente': 'Pendente',
                'concluido': 'Concluído'
            };
            return textos[status] || status;
        }

        function formatarData(data) {
            if (!data) return 'Não definida';
            return new Date(data).toLocaleDateString('pt-BR');
        }

        // Controle da sidebar mobile
        function abrirSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function fecharSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        // Inicialização
        async function init() {
            try {
                await initDB();
                await carregarProcessos();
                
                renderizarSidebar();
                renderizarGrid('');
                limparFormulario();
                
                // Evento de submit do formulário
                document.getElementById('processoForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const processo = {
                        id: parseInt(document.getElementById('processoId').value) || undefined,
                        numero: document.getElementById('numero').value,
                        titulo: document.getElementById('titulo').value,
                        cliente: document.getElementById('cliente').value,
                        status: document.getElementById('status').value,
                        descricao: document.getElementById('descricao').value,
                        dataCadastro: document.getElementById('dataCadastro').value || new Date().toISOString().split('T')[0]
                    };
                    
                    await salvarProcesso(processo);
                    await carregarProcessos();
                    
                    limparFormulario();
                    renderizarSidebar();
                    renderizarGrid(document.getElementById('searchInput').value);
                    
                    alert('Processo salvo com sucesso!');
                });
                
                // Evento de cancelar
                document.getElementById('cancelBtn').addEventListener('click', () => {
                    limparFormulario();
                });
                
                // Evento de pesquisa com debounce - CORRIGIDO
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    // Limpar timeout anterior
                    if (searchTimeout) {
                        clearTimeout(searchTimeout);
                    }
                    
                    // Aguardar pausa na digitação
                    searchTimeout = setTimeout(() => {
                        renderizarGrid(e.target.value);
                    }, 300);
                });
                
                // Garantir que o input mantenha o foco
                searchInput.addEventListener('blur', () => {
                    setTimeout(() => {
                        if (document.activeElement !== searchInput) {
                            searchInput.focus();
                        }
                    }, 100);
                });
                
                // Eventos da sidebar mobile
                document.getElementById('menuToggle').addEventListener('click', abrirSidebar);
                document.getElementById('sidebarOverlay').addEventListener('click', fecharSidebar);
                
                // Ajustar sidebar ao redimensionar
                window.addEventListener('resize', () => {
                    if (window.innerWidth >= 768) {
                        fecharSidebar();
                        document.getElementById('sidebar').style.transform = '';
                    }
                });
                
                console.log('Aplicação inicializada com sucesso!');
                
            } catch (error) {
                console.error('Erro ao inicializar:', error);
                alert('Erro ao inicializar o banco de dados. Verifique se seu navegador suporta IndexedDB.');
            }
        }
        
        // Iniciar aplicação
        init();
    </script>
</body>
</html>
